<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Clicker</title>
    <script src="https://kit.fontawesome.com/20e7b179a7.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="main">
        <div class="left">
            <h3>Gems: <span class="balance">500</span></h3>
            <div style="display: flex; justify-content: center;">
                <i class="fa-solid fa-gem gem" onclick="incrementBalance()"></i>
            </div>
        </div>
        <div class="right">
            <div class="upgrade" onclick="buyClicker()">
                <div class="left-sec">
                    <i class="fa-solid fa-computer-mouse items"></i>
                </div>
                <div class="middle-sec">
                    <h4>Clicker</h4>
                    <div>
                        <span>Cost: <span class="clicker-cost">5</span></span>
                        <i class="fa-solid fa-gem"></i>
                    </div>
                </div>
                <div class="right-sec">
                    lvl <span class="clicker-level">0</span>
                </div>
                <div class="next-level">
                    <p>
                        +<span class="clicker-increase">1</span> gems <br>per second
                    </p>
                </div>
            </div>

            <div class="upgrade" onclick="buyClicker()">
                <div class="left-sec">
                    <i class="fa-solid fa-rocket items"></i>
                </div>
                <div class="middle-sec">
                    <h4>Clicker</h4>
                    <div>
                        <span>Cost: <span class="clicker-cost">5</span></span>
                        <i class="fa-solid fa-gem"></i>
                    </div>
                </div>
                <div class="right-sec">
                    lvl <span class="clicker-level">0</span>
                </div>
                <div class="next-level">
                    <p>
                        +<span class="clicker-increase">1</span> gems <br>per second
                    </p>
                </div>
            </div>

        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
